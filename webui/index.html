<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Cutter</title>
<style>
  /* Hand-written on purpose: this page has to work with no network. */
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel-2: #172033; --line: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --cut: #f87171;
    --keep: #4ade80; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  button, input, select {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  input { background: #0b1220; }
  .hidden { display: none !important; }
  kbd {
    font: 11px/1 ui-monospace, Consolas, monospace; background: #0b1220;
    border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; color: var(--muted);
  }

  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  header .tag {
    font-size: 11px; color: var(--accent); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 8px;
  }
  header .hint { margin-left: auto; color: var(--muted); font-size: 12px; }

  .app { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 47px); }
  aside { border-right: 1px solid var(--line); background: var(--panel-2); min-width: 0; }
  .folder-bar { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  .folder-bar input { flex: 1; min-width: 0; font-size: 12px; }
  .files { overflow-y: auto; max-height: calc(100vh - 100px); }
  .row {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid #23304a; border-radius: 0; padding: 8px 12px;
  }
  .row:hover { background: #1c2841; border-color: #23304a; }
  .row.dir { color: var(--muted); }
  .row.active { background: #1c3247; box-shadow: inset 2px 0 0 var(--accent); }
  .row .name { display: block; word-break: break-all; }
  .row .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

  main { padding: 16px 18px 40px; min-width: 0; }
  .placeholder { color: var(--muted); padding: 40px 0; }
  video { width: 100%; max-height: 46vh; background: #000; border-radius: 6px; display: block; }

  .timeline {
    position: relative; height: 30px; margin-top: 10px; border-radius: 4px;
    background: #0b1220; border: 1px solid var(--line); cursor: pointer; overflow: hidden;
  }
  .timeline .block { position: absolute; top: 0; bottom: 0; }
  .timeline .block.cut { background: rgba(248,113,113,.55); }
  .timeline .block.keep { background: rgba(74,222,128,.45); }
  .timeline .pending { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
  .timeline .cursor { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
  .times { display: flex; justify-content: space-between; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); margin-top: 4px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .bar .spacer { flex: 1; }
  .mark { border-color: var(--warn); }
  .mark.ready { background: #3b2f10; }

  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 14px 0 0; padding: 10px 12px; }
  legend { color: var(--muted); font-size: 12px; padding: 0 6px; }

  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px 6px; }
  td { padding: 3px 6px; border-top: 1px solid #23304a; }
  td input { width: 130px; font: 12px ui-monospace, Consolas, monospace; padding: 3px 6px; }
  td.n { color: var(--muted); width: 26px; }
  .icon { padding: 2px 8px; }
  .empty-note { color: var(--muted); font-size: 13px; padding: 6px 2px; }

  .summary { margin-top: 10px; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
  .summary b { color: var(--text); }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .opts label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #output { width: 320px; font-size: 12px; }
  .run { background: #0369a1; border-color: #0284c7; font-weight: 600; padding: 7px 18px; }
  .run:hover:not(:disabled) { background: #0284c7; }

  pre#log {
    margin: 14px 0 0; background: #060b16; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; max-height: 240px; overflow-y: auto; color: #cbd5e1;
  }
  .result { margin-top: 12px; border: 1px solid var(--keep); border-radius: 6px; padding: 10px 12px; }
  .result.bad { border-color: var(--cut); }
  .result .path { font: 12px ui-monospace, Consolas, monospace; word-break: break-all; }
  .note { margin-top: 8px; color: var(--warn); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>Video Cutter</h1>
  <span class="tag">local · nothing is uploaded</span>
  <span class="hint">
    <kbd>space</kbd> play &nbsp; <kbd>←</kbd><kbd>→</kbd> 1s &nbsp; <kbd>J</kbd><kbd>L</kbd> 5s
    &nbsp; <kbd>I</kbd> start &nbsp; <kbd>O</kbd> end
  </span>
</header>

<div class="app">

  <aside>
    <div class="folder-bar">
      <button id="up" title="Parent folder">↑</button>
      <input id="dir" spellcheck="false" placeholder="C:\path\to\videos">
      <button id="load">Load</button>
    </div>
    <div class="files" id="files"></div>
  </aside>

  <main>
    <div class="placeholder" id="placeholder">Pick a folder, then pick a video.</div>

    <section id="editor" class="hidden">
      <video id="player" preload="metadata" controls></video>
      <div class="note hidden" id="video-note"></div>

      <div class="timeline" id="timeline">
        <div id="blocks"></div>
        <div class="pending hidden" id="pending"></div>
        <div class="cursor" id="cursor" style="left:0"></div>
      </div>
      <div class="times">
        <span id="cur">0:00:00.000</span>
        <span id="dur">0:00:00.000</span>
      </div>

      <div class="bar">
        <button data-seek="-5">« 5s</button>
        <button data-seek="-1">‹ 1s</button>
        <button id="playpause">Play</button>
        <button data-seek="1">1s ›</button>
        <button data-seek="5">5s »</button>
        <span class="spacer"></span>
        <button class="mark" id="mark-start">Mark start <kbd>I</kbd></button>
        <button class="mark" id="mark-end" disabled>Mark end <kbd>O</kbd></button>
        <button id="mark-cancel" class="hidden">Cancel</button>
      </div>

      <fieldset>
        <legend>Marked ranges</legend>
        <div class="opts">
          <label><input type="radio" name="rmode" value="cut" checked> these ranges are <b>removed</b></label>
          <label><input type="radio" name="rmode" value="keep"> only these ranges are <b>kept</b></label>
          <span class="spacer"></span>
          <button id="clear">Clear all</button>
        </div>
        <table id="ranges"></table>
        <div class="empty-note" id="ranges-empty">
          Nothing marked yet. Play the video, press <kbd>I</kbd> where the unwanted part
          starts and <kbd>O</kbd> where it ends.
        </div>
        <div class="summary" id="summary"></div>
      </fieldset>

      <fieldset>
        <legend>Output</legend>
        <div class="opts">
          <label>file <input id="output" spellcheck="false"></label>
          <label>
            <select id="mode">
              <option value="reencode">precise (re-encode)</option>
              <option value="copy">fast (no re-encode, snaps to keyframes)</option>
            </select>
          </label>
          <label id="crf-label">quality <input id="crf" type="number" min="0" max="51" value="20" style="width:64px"></label>
          <label><input type="checkbox" id="separate"> one file per kept range</label>
        </div>
      </fieldset>

      <div class="bar">
        <button class="run" id="run">Cut it</button>
        <button id="preview">Preview the plan</button>
        <button id="copy-cli">Copy CLI command</button>
        <span class="spacer"></span>
        <span id="busy" class="hidden" style="color:var(--accent)">working ...</span>
      </div>

      <pre id="log" class="hidden"></pre>
      <div id="result" class="result hidden"></div>
    </section>
  </main>
</div>

<script>
const state = {
  dir: '', files: [], current: null, duration: 0,
  ranges: [], rangeMode: 'cut', pending: null, polling: null,
};

const el = (id) => document.getElementById(id);
const player = el('player');

// ---------------------------------------------------------------- time helpers

function fmt(seconds) {
  const ms = Math.max(0, Math.round(seconds * 1000));
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms % 1000).padStart(3, '0')}`;
}

// Same grammar as the CLI: 90, 1:30, 0:01:30, 1:30.5, end
function parseTime(text, duration) {
  const raw = String(text).trim().toLowerCase();
  if (raw === '' || raw === 'start') return 0;
  if (raw === 'end' || raw === 'eof') return duration;
  const parts = raw.replace(/s$/, '').split(':');
  if (parts.length > 3) return NaN;
  let total = 0;
  for (const part of parts) {
    const value = Number(part);
    if (part === '' || Number.isNaN(value) || value < 0) return NaN;
    total = total * 60 + value;
  }
  return total;
}

function mergeRanges(ranges) {
  const out = [];
  for (const r of [...ranges].sort((a, b) => a.start - b.start)) {
    const last = out[out.length - 1];
    if (last && r.start <= last.end) last.end = Math.max(last.end, r.end);
    else out.push({ start: r.start, end: r.end });
  }
  return out;
}

// Mirrors invert_ranges() in video_cutter.py, so the page shows the real result length.
function keptRanges() {
  const merged = mergeRanges(state.ranges);
  if (state.rangeMode === 'keep') return merged;
  const keeps = [];
  let position = 0;
  for (const r of merged) {
    if (r.start - position >= 0.05) keeps.push({ start: position, end: r.start });
    position = Math.max(position, r.end);
  }
  if (state.duration - position >= 0.05) keeps.push({ start: position, end: state.duration });
  return keeps;
}

// ------------------------------------------------------------------ file browser

async function loadDir(path) {
  const res = await fetch('/api/list?dir=' + encodeURIComponent(path));
  const data = await res.json();
  if (data.error) { el('files').innerHTML = `<div class="empty-note">${data.error}</div>`; return; }
  state.dir = data.dir;
  state.parent = data.parent;
  state.files = data.files;
  el('dir').value = data.dir;

  const parts = [];
  for (const d of data.dirs) {
    parts.push(`<button class="row dir" data-dir="${escapeAttr(d.path)}">
      <span class="name">📁 ${escapeHtml(d.name)}</span></button>`);
  }
  data.files.forEach((f, i) => {
    const meta = [f.duration != null ? fmt(f.duration) : 'unknown length',
                  (f.size / 1048576).toFixed(1) + ' MB'].join(' · ');
    parts.push(`<button class="row file" data-index="${i}">
      <span class="name">${escapeHtml(f.name)}</span>
      <span class="meta">${meta}</span></button>`);
  });
  if (!data.dirs.length && !data.files.length) parts.push('<div class="empty-note">No videos here.</div>');
  el('files').innerHTML = parts.join('');
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
const escapeAttr = escapeHtml;

function selectFile(index) {
  const file = state.files[index];
  if (!file) return;
  state.current = file;
  state.ranges = [];
  state.pending = null;
  state.duration = file.duration || 0;

  document.querySelectorAll('.row.file').forEach((row, i) => {
    row.classList.toggle('active', i === index);
  });
  el('placeholder').classList.add('hidden');
  el('editor').classList.remove('hidden');
  el('result').classList.add('hidden');
  el('log').classList.add('hidden');
  el('dur').textContent = fmt(state.duration);

  const dot = file.name.lastIndexOf('.');
  const stem = dot > 0 ? file.name.slice(0, dot) : file.name;
  const ext = dot > 0 ? file.name.slice(dot) : '.mp4';
  el('output').value = `${stem}_cut${ext}`;

  player.src = '/api/media?path=' + encodeURIComponent(file.path);
  const note = el('video-note');
  if (file.playable) note.classList.add('hidden');
  else {
    note.textContent = `Your browser probably cannot preview ${ext} - cutting still works, `
      + 'but you may have to type the times by hand.';
    note.classList.remove('hidden');
  }
  render();
}

// ----------------------------------------------------------------------- render

function render() {
  // ranges table
  const rows = state.ranges.map((r, i) => `
    <tr>
      <td class="n">${i + 1}</td>
      <td><input data-edit="start" data-i="${i}" value="${fmt(r.start)}"></td>
      <td><input data-edit="end" data-i="${i}" value="${fmt(r.end)}"></td>
      <td style="color:var(--muted)">${(r.end - r.start).toFixed(3)}s</td>
      <td><button class="icon" data-jump="${i}" title="Jump to the start">▶</button>
          <button class="icon" data-del="${i}" title="Delete">✕</button></td>
    </tr>`);
  el('ranges').innerHTML = rows.length
    ? `<tr><th></th><th>from</th><th>to</th><th>length</th><th></th></tr>${rows.join('')}`
    : '';
  el('ranges-empty').classList.toggle('hidden', rows.length > 0);

  // timeline blocks
  const blocks = [];
  if (state.duration > 0) {
    const cls = state.rangeMode === 'cut' ? 'cut' : 'keep';
    for (const r of mergeRanges(state.ranges)) {
      const left = (r.start / state.duration) * 100;
      const width = ((r.end - r.start) / state.duration) * 100;
      blocks.push(`<div class="block ${cls}" style="left:${left}%;width:${width}%"></div>`);
    }
  }
  el('blocks').innerHTML = blocks.join('');

  const pending = el('pending');
  if (state.pending != null && state.duration > 0) {
    pending.style.left = (state.pending / state.duration) * 100 + '%';
    pending.classList.remove('hidden');
  } else pending.classList.add('hidden');

  el('mark-end').disabled = state.pending == null;
  el('mark-start').classList.toggle('ready', state.pending == null);
  el('mark-cancel').classList.toggle('hidden', state.pending == null);

  // summary
  const kept = keptRanges();
  const total = kept.reduce((sum, r) => sum + (r.end - r.start), 0);
  el('summary').innerHTML = state.ranges.length === 0 ? ''
    : `original <b>${fmt(state.duration)}</b> &nbsp;·&nbsp; removed `
      + `<b>${(state.duration - total).toFixed(3)}s</b> &nbsp;·&nbsp; result `
      + `<b>${fmt(total)}</b> in <b>${kept.length}</b> piece(s)`;
  el('run').disabled = state.ranges.length === 0 || total <= 0;
  el('crf-label').style.opacity = el('mode').value === 'copy' ? .4 : 1;
}

function addRange(start, end) {
  if (end - start < 0.05) return;
  state.ranges.push({ start, end });
  state.ranges.sort((a, b) => a.start - b.start);
}

// ---------------------------------------------------------------------- actions

function seekBy(delta) {
  player.currentTime = Math.min(Math.max(0, player.currentTime + delta), state.duration || player.duration || 0);
}

function markStart() { state.pending = player.currentTime; render(); }

function markEnd() {
  if (state.pending == null) return;
  const start = Math.min(state.pending, player.currentTime);
  const end = Math.max(state.pending, player.currentTime);
  addRange(start, end);
  state.pending = null;
  render();
}

function buildRanges() {
  return state.ranges.map((r) => `${r.start.toFixed(3)}-${r.end.toFixed(3)}`);
}

function cliCommand() {
  const flag = state.rangeMode === 'cut' ? '--cut' : '--keep';
  const bits = ['python video_cutter.py', `"${state.current.path}"`];
  for (const r of buildRanges()) bits.push(`${flag} ${r}`);
  if (el('mode').value === 'copy') bits.push('--mode copy');
  else if (el('crf').value !== '20') bits.push(`--crf ${el('crf').value}`);
  if (el('separate').checked) bits.push('--separate');
  if (el('output').value.trim()) bits.push(`-o "${el('output').value.trim()}"`);
  return bits.join(' ');
}

async function runCut(dryRun) {
  if (!state.current || !state.ranges.length) return;
  const output = el('output').value.trim();
  const payload = {
    input: state.current.path,
    ranges: buildRanges(),
    range_mode: state.rangeMode,
    // A bare file name means "next to the input", which is what the field shows.
    output: output && !/[\\/]/.test(output) ? joinPath(state.dir, output) : output,
    mode: el('mode').value,
    crf: Number(el('crf').value) || 20,
    separate: el('separate').checked,
    dry_run: !!dryRun,
  };

  el('log').textContent = '';
  el('log').classList.remove('hidden');
  el('result').classList.add('hidden');
  setBusy(true);

  const res = await fetch('/api/cut', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  if (data.error) { finish({ status: 'error', error: data.error, log: '' }); return; }
  poll(data.job);
}

function poll(jobId) {
  clearInterval(state.polling);
  state.polling = setInterval(async () => {
    const res = await fetch('/api/job/' + jobId);
    const job = await res.json();
    el('log').textContent = job.log || '';
    el('log').scrollTop = el('log').scrollHeight;
    if (job.status !== 'running') { clearInterval(state.polling); finish(job); }
  }, 600);
}

function finish(job) {
  setBusy(false);
  const box = el('result');
  box.classList.remove('hidden');
  if (job.status === 'error') {
    box.classList.add('bad');
    box.innerHTML = `<b>Failed:</b> <span class="path">${escapeHtml(job.error || 'unknown error')}</span>`;
    return;
  }
  box.classList.remove('bad');
  if (!job.outputs || !job.outputs.length) {
    box.innerHTML = '<b>Plan only</b> — nothing was written. The log above shows what would happen.';
    return;
  }
  const items = job.outputs.map((path) => `
    <div style="margin-top:6px">
      <span class="path">${escapeHtml(path)}</span>
      <button class="icon" data-play="${escapeAttr(path)}">Play</button>
      <button class="icon" data-reveal="${escapeAttr(path)}">Show in folder</button>
    </div>`);
  box.innerHTML = `<b>Done</b> — ${job.outputs.length} file(s) written:${items.join('')}`;
}

function setBusy(busy) {
  el('busy').classList.toggle('hidden', !busy);
  el('run').disabled = busy;
  el('preview').disabled = busy;
}

function joinPath(dir, name) {
  const sep = dir.includes('\\') ? '\\' : '/';
  return dir.endsWith(sep) ? dir + name : dir + sep + name;
}

// ------------------------------------------------------------------------ events

el('load').addEventListener('click', () => loadDir(el('dir').value));
el('dir').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') loadDir(el('dir').value); });
el('up').addEventListener('click', () => { if (state.parent) loadDir(state.parent); });

el('files').addEventListener('click', (ev) => {
  const row = ev.target.closest('.row');
  if (!row) return;
  if (row.dataset.dir !== undefined) loadDir(row.dataset.dir);
  else selectFile(Number(row.dataset.index));
});

document.querySelectorAll('[data-seek]').forEach((btn) => {
  btn.addEventListener('click', () => seekBy(Number(btn.dataset.seek)));
});
el('playpause').addEventListener('click', () => (player.paused ? player.play() : player.pause()));
el('mark-start').addEventListener('click', markStart);
el('mark-end').addEventListener('click', markEnd);
el('mark-cancel').addEventListener('click', () => { state.pending = null; render(); });
el('clear').addEventListener('click', () => { state.ranges = []; state.pending = null; render(); });

document.querySelectorAll('input[name=rmode]').forEach((radio) => {
  radio.addEventListener('change', () => { state.rangeMode = radio.value; render(); });
});
el('mode').addEventListener('change', render);

el('ranges').addEventListener('click', (ev) => {
  const del = ev.target.closest('[data-del]');
  if (del) { state.ranges.splice(Number(del.dataset.del), 1); render(); return; }
  const jump = ev.target.closest('[data-jump]');
  if (jump) { player.currentTime = state.ranges[Number(jump.dataset.jump)].start; }
});

el('ranges').addEventListener('change', (ev) => {
  const input = ev.target.closest('[data-edit]');
  if (!input) return;
  const range = state.ranges[Number(input.dataset.i)];
  const value = parseTime(input.value, state.duration);
  if (Number.isNaN(value)) { render(); return; }
  const clamped = Math.min(Math.max(0, value), state.duration);
  if (input.dataset.edit === 'start' && clamped < range.end) range.start = clamped;
  else if (input.dataset.edit === 'end' && clamped > range.start) range.end = clamped;
  state.ranges.sort((a, b) => a.start - b.start);
  render();
});

el('timeline').addEventListener('click', (ev) => {
  if (!state.duration) return;
  const box = el('timeline').getBoundingClientRect();
  player.currentTime = ((ev.clientX - box.left) / box.width) * state.duration;
});

el('result').addEventListener('click', async (ev) => {
  const play = ev.target.closest('[data-play]');
  if (play) {
    player.src = '/api/media?path=' + encodeURIComponent(play.dataset.play);
    player.play().catch(() => {});
    return;
  }
  const reveal = ev.target.closest('[data-reveal]');
  if (reveal) {
    await fetch('/api/reveal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: reveal.dataset.reveal }),
    });
  }
});

el('run').addEventListener('click', () => runCut(false));
el('preview').addEventListener('click', () => runCut(true));
el('copy-cli').addEventListener('click', async (ev) => {
  if (!state.current) return;
  await navigator.clipboard.writeText(cliCommand());
  ev.target.textContent = 'Copied!';
  setTimeout(() => { ev.target.textContent = 'Copy CLI command'; }, 1200);
});

player.addEventListener('timeupdate', () => {
  el('cur').textContent = fmt(player.currentTime);
  if (state.duration > 0) {
    el('cursor').style.left = (player.currentTime / state.duration) * 100 + '%';
  }
});
player.addEventListener('loadedmetadata', () => {
  // Trust the player once it knows better than ffprobe did.
  if (Number.isFinite(player.duration) && player.duration > 0) {
    state.duration = player.duration;
    el('dur').textContent = fmt(state.duration);
    render();
  }
});
player.addEventListener('play', () => { el('playpause').textContent = 'Pause'; });
player.addEventListener('pause', () => { el('playpause').textContent = 'Play'; });
player.addEventListener('error', () => {
  const note = el('video-note');
  note.textContent = 'This browser cannot play this file, so there is no preview. '
    + 'You can still type the times by hand and cut it.';
  note.classList.remove('hidden');
});

document.addEventListener('keydown', (ev) => {
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (!state.current) return;
  const keys = {
    ' ': () => (player.paused ? player.play() : player.pause()),
    k: () => (player.paused ? player.play() : player.pause()),
    arrowleft: () => seekBy(-1), arrowright: () => seekBy(1),
    j: () => seekBy(-5), l: () => seekBy(5),
    i: markStart, o: markEnd,
  };
  const action = keys[ev.key === ' ' ? ' ' : ev.key.toLowerCase()];
  if (action) { ev.preventDefault(); action(); }
});

// The server passes the starting folder in the query string.
const startDir = new URLSearchParams(location.search).get('dir') || '.';
loadDir(startDir);
</script>
</body>
